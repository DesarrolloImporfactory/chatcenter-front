name: Release and deploy production

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Release production bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Create production environment file
        env:
          PROD_FRONT_ENV: ${{ secrets.PROD_FRONT_ENV }}
        run: printf '%s\n' "$PROD_FRONT_ENV" > .env

      - name: Build application
        run: npm run build

      - name: Package production bundle
        run: tar -czf "chatcenter-front-${GITHUB_REF_NAME}.tar.gz" -C dist .

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "chatcenter-front-${GITHUB_REF_NAME}.tar.gz" --generate-notes --verify-tag

      - name: Configure production SSH key
        env:
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '98.91.50.83 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIqqEOVvNtSMXGB74E/IAHp50rZSfIaZ9DEBvP7TPfnv' > ~/.ssh/known_hosts

      - name: Publish bundle to production
        run: |
          rsync --archive --compress --delete --delay-updates --backup \
            --backup-dir="/var/www/chatcenter-front/releases/${GITHUB_REF_NAME}" \
            dist/ deploychatcenter@98.91.50.83:/var/www/chatcenter-front/dist/

      - name: Verify production site
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 https://chatcenter.imporfactory.app/ > /dev/null
