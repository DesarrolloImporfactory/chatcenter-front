name: Deploy development

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy development
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: development

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Create development environment file
        env:
          DEV_FRONT_ENV: ${{ secrets.DEV_FRONT_ENV }}
        run: printf '%s\n' "$DEV_FRONT_ENV" > .env

      - name: Build development application
        run: npm run build

      - name: Configure development SSH key
        env:
          DEV_SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEV_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '98.91.50.83 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIqqEOVvNtSMXGB74E/IAHp50rZSfIaZ9DEBvP7TPfnv' > ~/.ssh/known_hosts

      - name: Publish bundle to development
        run: rsync --archive --compress --delete --delay-updates dist/ deployfront@98.91.50.83:/var/www/devfront/dist/

      - name: Verify development site
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 https://dev.imporfactory.app/ > /dev/null
