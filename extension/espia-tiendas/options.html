<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Mi cuenta · ImporKiller</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 40px 16px; font: 14px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; color: #0b1426; background: #f3f4f6; }
    .caja { max-width: 520px; margin: 0 auto; background: #fff; border: 1px solid #e2e8f0; border-radius: 20px; box-shadow: 0 20px 50px -30px rgba(11,20,38,.45); overflow: hidden; }
    header { display: flex; align-items: center; gap: 12px; padding: 22px 24px; color: #fff; background: radial-gradient(110% 120% at 0% 0%, rgba(14,165,233,.4) 0%, rgba(11,20,38,0) 60%), #0b1426; }
    header img { width: 40px; height: 40px; border-radius: 12px; }
    header h1 { margin: 0; font-size: 20px; font-weight: 800; }
    header h1 b { color: #38bdf8; }
    header p { margin: 0; font-size: 12.5px; color: #9fb7d6; }
    section { padding: 20px 24px; }
    h2 { margin: 0 0 10px; font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #64748b; }

    .estado { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: 14px; background: #f1f5f9; border: 1px solid #e2e8f0; }
    .estado .punto { flex: none; width: 10px; height: 10px; margin-top: 6px; border-radius: 50%; background: #94a3b8; }
    .estado.ok { background: #ecfdf5; border-color: #a7f3d0; } .estado.ok .punto { background: #10b981; }
    .estado.err { background: #fffbeb; border-color: #fde68a; } .estado.err .punto { background: #f59e0b; }
    .estado b { display: block; }
    .estado span { color: #475569; font-size: 13px; }

    .fila { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    button, a.boton { display: inline-block; padding: 9px 16px; border: 1px solid #e2e8f0; border-radius: 10px; background: #fff; color: #0b1426; font: inherit; font-weight: 700; cursor: pointer; text-decoration: none; }
    button:hover, a.boton:hover { background: #f8fafc; }
    .principal { background: #0b1426 !important; color: #fff !important; border-color: #0b1426 !important; }
    .principal:hover { background: #13244a !important; }

    details { border-top: 1px solid #e2e8f0; }
    summary { padding: 16px 24px; cursor: pointer; font-weight: 700; color: #475569; }
    summary small { font-weight: 400; color: #94a3b8; }
    details section { padding-top: 0; }
    label { display: block; font-weight: 700; margin-top: 14px; font-size: 13px; }
    input, select { width: 100%; padding: 9px 10px; border: 1px solid #cbd5e1; border-radius: 10px; font: inherit; margin-top: 4px; }
    small { color: #64748b; }
    #detalle { margin-top: 12px; font-size: 12px; color: #64748b; word-break: break-word; }
  </style>
</head>
<body>
  <div class="caja">
    <header>
      <img src="icons/48.png" alt="" />
      <div>
        <h1>Impor<b>Killer</b></h1>
        <p>Mi cuenta</p>
      </div>
    </header>

    <section>
      <h2>Tu cuenta</h2>
      <div class="estado" id="estado">
        <i class="punto"></i>
        <div><b id="estadoTitulo">Comprobando…</b><span id="estadoTexto"></span></div>
      </div>
      <div class="fila">
        <a id="abrir" class="boton principal" href="#" target="_blank" rel="noopener">Abrir ImporKiller</a>
        <button id="probar" type="button">Comprobar conexión</button>
        <button id="salir" type="button">Cerrar sesión en la extensión</button>
      </div>
      <p><small>La extensión usa la misma cuenta con la que entras a ImporChat en este navegador: no hay que configurar nada.</small></p>
    </section>

    <!-- Solo para soporte: nadie necesita tocarlo en el uso normal. -->
    <details>
      <summary>Opciones avanzadas <small>· solo si soporte te lo pide</small></summary>
      <section>
        <label for="preset">Servidor de ImporChat</label>
        <select id="preset">
          <option value="https://chat.imporfactory.app/api/v1">Producción</option>
          <option value="https://developer.imporfactory.app/api/v1">Desarrollo</option>
          <option value="http://localhost:3000/api/v1">Local</option>
          <option value="otro">Otra dirección…</option>
        </select>
        <input id="apiBase" type="url" placeholder="https://servidor/api/v1" />

        <label for="token">Llave de sesión</label>
        <input id="token" type="password" placeholder="Solo si la extensión no tomó la sesión sola" autocomplete="off" />

        <div class="fila">
          <button id="guardar" type="button" class="principal">Guardar</button>
        </div>
        <div id="detalle"></div>
      </section>
    </details>
  </div>
  <script src="options.js"></script>
</body>
</html>
